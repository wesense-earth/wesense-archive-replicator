[package]
name = "wesense-archive-replicator"
version = "0.1.0"
edition = "2021"
description = "WeSense archive replicator — BLAKE3 blob store + P2P gossip replication"

[dependencies]
iroh = "1"
iroh-blobs = { version = "0.104", features = ["fs-store"] }
iroh-gossip = "0.101"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
blake3 = "1"
n0-future = "0.3"
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
